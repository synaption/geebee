name: Docker Provision Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Verify compose file
        run: docker compose config

      - name: Check script and Ansible syntax
        run: |
          bash -n docker-provision.sh
          ansible-playbook ansible/docker.yml --inventory inventory/docker/hosts --limit gbdocker --syntax-check

      - name: Run Docker provisioning
        run: ./docker-provision.sh

      - name: Verify services are enabled
        run: |
          docker exec geebee systemctl is-enabled videoteam-voctocore.service
          docker exec geebee systemctl is-enabled videoteam-voctocore-cmds.service
          docker exec geebee systemctl is-enabled videoteam-record.service

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
