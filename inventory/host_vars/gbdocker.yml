---
# Ansible connects to the container via 'docker exec' — no SSH needed.
# The container must be running before provisioning (see docker-provision.sh).
ansible_connection: docker
ansible_host: geebee  # must match container_name in docker-compose.yml

room_name: docker
skip_unit_test: true

# Use software-only audio/video so no real capture hardware is required
audio_device: "hw:Dummy"
video_sink: "fakevideosink"

# Suppress pre-exec GStreamer tests that require a running X display
ExecStartPres: []

voctomix:
  version: "main"
  display_system: gl
  framerate: 25
  audio_channels: 2
  previews: false
  mirrors: false
  auto_copy_recordings: false
  autostart_gui: false

# Virtual sources only — no v4l2/libcamera hardware required
ingest_sources:
  - description: "sweep and beep"
    name: cam
    kind: gst
    video_source: "videotestsrc pattern=ball motion=hsweep animation-mode=wall-time flip=true is-live=true"
    audio_source: "audiotestsrc wave=ticks freq=330"
    audio.beep: 0+1

  - description: "color bars and tone"
    name: slides
    kind: gst
    video_source: "videotestsrc pattern=smpte is-live=true"
    audio_source: "audiotestsrc wave=sine is-live=true"
    audio.tone: 0+1
